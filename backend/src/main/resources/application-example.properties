# =============================================================================
# application-example.properties
# NexaERP – Example / Template Configuration
# =============================================================================
# Copy this file and use it as a reference when setting up environment
# variables for local development or deployment.
#
# DO NOT commit real secrets. This file is safe to commit because it only
# contains placeholder values.
#
# HOW TO USE (choose one approach):
#   1. IDE Run Configuration – set environment variables in your run config.
#   2. .env file          – export variables before starting the app:
#                              source .env   (Linux/macOS)
#                              $env:...=... (PowerShell)
#   3. Docker / CI        – inject via -e flags or your CI secret manager.
# =============================================================================

#spring.application.name=backend

# ---------------------------------------------------------------------------
# DataSource – MySQL
# ---------------------------------------------------------------------------
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost:3306/nexaerp

# Required environment variables:
#   DB_USERNAME   – MySQL user with access to the 'nexaerp' schema
#   DB_PASSWORD   – Password for the above user
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
#
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.hibernate.ddl-auto=update

# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
#server.port=8085

# ---------------------------------------------------------------------------
# JWT
# ---------------------------------------------------------------------------
# Required environment variable:
#   JWT_SECRET   – A random string of at least 32 characters (256-bit).
#                  Generate with: openssl rand -hex 32
#                  Example placeholder (NOT a real secret):
#                  change-me-to-a-random-256-bit-hex-string-here-00000000000
#app.jwt.secret=${JWT_SECRET}
#app.jwt.access-token-expiration=900000
#app.jwt.refresh-token-expiration=604800000

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------
#app.security.max-failed-attempts=5
#app.security.lock-duration-minutes=30

# ---------------------------------------------------------------------------
# Browser auth cookie and exact credentialed CORS origins
# ---------------------------------------------------------------------------
# Local HTTP:
#app.auth.cookie.name=${AUTH_COOKIE_NAME:nexa_refresh_token}
#app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
#app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
#app.auth.cookie.path=${AUTH_COOKIE_PATH:/api/auth/web}
#app.auth.cookie.max-age=${AUTH_COOKIE_MAX_AGE:604800}
#app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
#
# Same-site HTTPS production:
# AUTH_COOKIE_NAME=__Host-nexa_refresh_token
# AUTH_COOKIE_SECURE=true
# AUTH_COOKIE_SAME_SITE=Strict
# AUTH_COOKIE_PATH=/
# CORS_ALLOWED_ORIGINS=https://erp.example.com
#
# Cross-site deployments require Secure=true and SameSite=None, plus exact
# trusted origins. Never use wildcard origins with credentialed requests.

