spring.application.name=backend

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nx_system_1}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Railway auto-injects PORT — fallback to 8085 for local dev
server.port=${PORT:8085}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:nexaerp-jwt-secret-key-2025-very-long-and-secure-string-minimum-256-bit}
app.jwt.access-token-expiration=900000
app.jwt.refresh-token-expiration=604800000

# Security Configuration
app.security.max-failed-attempts=5
app.security.lock-duration-minutes=30

# Browser authentication cookie
app.auth.cookie.name=${AUTH_COOKIE_NAME:nexa_refresh_token}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.cookie.path=${AUTH_COOKIE_PATH:/api/auth/web}
app.auth.cookie.max-age=${AUTH_COOKIE_MAX_AGE:604800}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8086}

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sabbirhasan.private@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App URL (Frontend)
app.frontend.url=${FRONTEND_URL:http://localhost:4200}
app.mail.budget-alerts.enabled=${BUDGET_ALERT_EMAIL_ENABLED:true}

# Internal overdue reminders — reverted to sane production defaults
app.overdue.enabled=${OVERDUE_ENABLED:true}
app.overdue.invoice.enabled=true
app.overdue.vendor-bill.enabled=true
app.overdue.in-app.enabled=true
app.overdue.email.enabled=${OVERDUE_EMAIL_ENABLED:false}

# Daily at 6:15 AM instead of every 2 minutes
app.overdue.scheduler.cron=${OVERDUE_SCHEDULER_CRON:0 15 6 * * *}
app.overdue.time-zone=Asia/Dhaka

app.overdue.milestones=1,7,15,30
app.overdue.internal-email-only=true
app.overdue.email.max-attempts=3
app.overdue.email.retry-delay=PT24H
app.overdue.batch-size=100
app.overdue.processing-timeout=PT30M

# Default Super Admin
app.default-admin.email=${DEFAULT_ADMIN_EMAIL:admin@example.com}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:admin123}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads
app.upload.allowed-types=application/pdf,image/jpeg,image/png,image/jpg
app.approval.enabled=true
app.approval.manual-journal.enabled=true
app.approval.vendor-bill.enabled=true
app.approval.invoice.enabled=true
app.approval.payment.enabled=true